# Never let the Bluetooth controller's USB link autosuspend.
#
# The MT7922's BT half spends whole seconds asleep between wakes when this is
# on (measured: a third of total uptime), and everything a controller needs
# dies in those naps: SDP responses vanish (poisoning fresh pairings), HID
# feature reads time out (driver probe fails), input reports trickle at ~12/s
# instead of streaming, and the link drops under load. One setting, every
# Bluetooth symptom.
options btusb enable_autosuspend=0
